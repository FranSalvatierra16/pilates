<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#8F664C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sistema de Gestión" />
    <link rel="apple-touch-icon" href="/fitgest.png" />
    <!--
      IMPORTANTE: el manifest se inserta DESPUÉS de detectar alumno/estudio.
      Si el link nace con portal=estudio, Chrome del celu cachea start_url=/login
      y la app de recuperar abre el login de sucursal.
    -->
    <script>
      (function () {
        try {
          var path = location.pathname || '';
          var params = new URLSearchParams(location.search);
          var isAlumnoUrl =
            path.indexOf('/mi-clase') === 0 ||
            params.get('portal') === 'alumno' ||
            params.get('modo') === 'recuperar';

          function getCookie(name) {
            var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
            return m ? decodeURIComponent(m[1]) : '';
          }
          function setCookie(name, value) {
            document.cookie =
              name + '=' + encodeURIComponent(value) + '; path=/; max-age=34560000; SameSite=Lax';
          }

          var alumnoFlag =
            localStorage.getItem('fitgest_portal_alumno') === '1' || getCookie('fitgest_portal_alumno') === '1';
          var hasEstudioToken = !!localStorage.getItem('savia_token');

          var isStandalone =
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
            (navigator.standalone === true);

          var isEstudioUrl =
            path.indexOf('/login') === 0 ||
            params.get('portal') === 'estudio' ||
            path.indexOf('/dashboard') === 0 ||
            path.indexOf('/calendario') === 0 ||
            path.indexOf('/alumnos') === 0 ||
            path.indexOf('/pagos') === 0 ||
            path.indexOf('/caja') === 0 ||
            path.indexOf('/agenda') === 0 ||
            path.indexOf('/notificaciones') === 0 ||
            path.indexOf('/planificacion') === 0 ||
            path.indexOf('/admin') === 0 ||
            path.indexOf('/profesores') === 0 ||
            path.indexOf('/actividades') === 0;

          // Solo secuestrar a /mi-clase si es app alumno y NO es un launch de estudio
          // (antes /login?portal=estudio con flag alumno te mandaba a recuperar).
          if (isStandalone && alumnoFlag && !isAlumnoUrl && !isEstudioUrl) {
            var modoB = localStorage.getItem('fitgest_portal_alumno_modo') || getCookie('fitgest_portal_alumno_modo') || 'recuperar';
            var sidB = localStorage.getItem('fitgest_portal_alumno_sucursal') || getCookie('fitgest_portal_alumno_sucursal') || '';
            var qb = new URLSearchParams({ modo: modoB, portal: 'alumno' });
            if (sidB) qb.set('sucursalId', sidB);
            location.replace('/mi-clase?' + qb.toString());
            return;
          }

          var manifestHref;
          if (isAlumnoUrl) {
            localStorage.setItem('fitgest_pwa_role', 'alumno');
            localStorage.setItem('fitgest_portal_alumno', '1');
            setCookie('fitgest_portal_alumno', '1');
            var modo = params.get('modo') || 'recuperar';
            localStorage.setItem('fitgest_portal_alumno_modo', modo);
            setCookie('fitgest_portal_alumno_modo', modo);
            var sid = params.get('sucursalId') || '';
            if (sid) {
              localStorage.setItem('fitgest_portal_alumno_sucursal', sid);
              setCookie('fitgest_portal_alumno_sucursal', sid);
            }
            var q = new URLSearchParams({ portal: 'alumno', modo: modo });
            if (sid) q.set('sucursalId', sid);
            var token = params.get('token');
            if (token) q.set('token', token);
            manifestHref = '/api/manifest.webmanifest?' + q.toString();
            var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (appleTitle) appleTitle.setAttribute('content', 'Savia');
            document.title = 'Savia';
            var appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
            if (appleIcon) appleIcon.setAttribute('href', '/apple-touch-savia.png');
          } else if (isEstudioUrl || hasEstudioToken) {
            // Login / gestión / sesión de sucursal → manifest de estudio (para instalar la app correcta).
            localStorage.setItem('fitgest_pwa_role', 'estudio');
            if (!isStandalone) {
              localStorage.removeItem('fitgest_portal_alumno');
              localStorage.removeItem('fitgest_portal_alumno_modo');
              localStorage.removeItem('fitgest_portal_alumno_sucursal');
              document.cookie = 'fitgest_portal_alumno=; path=/; max-age=0; SameSite=Lax';
              document.cookie = 'fitgest_portal_alumno_modo=; path=/; max-age=0; SameSite=Lax';
              document.cookie = 'fitgest_portal_alumno_sucursal=; path=/; max-age=0; SameSite=Lax';
            }
            var qs = new URLSearchParams({ portal: 'estudio' });
            var sid2 = params.get('sucursalId') || localStorage.getItem('savia_sucursalId') || '';
            if (sid2) qs.set('sucursalId', sid2);
            else qs.set('brand', 'fitgest');
            manifestHref = '/api/manifest.webmanifest?' + qs.toString();
          } else {
            manifestHref = '/api/manifest.webmanifest?portal=estudio&brand=fitgest';
          }

          var link = document.createElement('link');
          link.id = 'app-manifest';
          link.rel = 'manifest';
          link.href = manifestHref;
          document.head.appendChild(link);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Sistema de Gestión</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
